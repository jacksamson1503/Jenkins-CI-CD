apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-cicd-app
  namespace: jenkins-cicd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jenkins-cicd-app
  template:
    metadata:
      labels:
        app: jenkins-cicd-app
    spec:
      containers:
        - name: jenkins-cicd-app
          image: jack1503/jack-devops-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "200m"
