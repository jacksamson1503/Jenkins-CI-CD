name: GitHub Actions CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t jack1503/jenkins-ci-cd:latest .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push jack1503/jenkins-ci-cd:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            docker pull jack1503/jenkins-ci-cd:latest
            docker stop jenkins-ci-cd || true
            docker rm jenkins-ci-cd || true
            docker run -d --name jenkins-ci-cd --restart unless-stopped -p 80:80 jack1503/jenkins-ci-cd:latest
            docker image prune -f
